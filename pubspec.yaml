name: market_mirror_mobile
description: "Market Mirror Mobile - Buyers, Mappers & Vendors"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# google_fonts uses path_provider for its font cache. The current Android
# implementation introduces a native JNI build that is incompatible with this
# project's Android/CMake toolchain, so retain the compatible implementation.
dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
